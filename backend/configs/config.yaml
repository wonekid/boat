server:
  port: 8080
  mode: debug # debug | release

mysql:
  host: 192.168.1.100
  port: 3306
  username: root
  password: Root@123456
  database: boat
  charset: utf8mb4
  # 连接池
  max-idle-conns: 10
  max-open-conns: 100
  log-mode: true

redis:
  host: 192.168.1.100
  port: 6379
  password: "123456"
  db: 0

jwt:
  secret: "SEVMTE9XT1JTREZAIykoIzIzMjMyCg=="
  expire-hours: 24

bastion:
  # SSH 堡垒机监听端口
  port: 2222
  host-key-path: "configs/ssh_host_key"

# OSP Agent 服务（执行机通过自定义端口加密回连，走自研 OSP 协议，非 SSH/HTTP）
# 执行机上的 osp-agent 主动外连本端口长连接待命，控制台经此通道下发命令/脚本任务并接收心跳指标。
osp:
  enabled: true
  port: 9090            # 自定义监听端口（需在防火墙/容器映射中放行）
  heartbeat: 10         # 下发给 Agent 的心跳周期（秒）
  offline-after: 35     # 超过该秒数未收到心跳即判定节点离线
  handshake-timeout: 20 # 握手超时（秒）
  db-throttle: 5        # 心跳写库节流间隔（秒），降低高频写库压力

# 会话录像存储根目录
record:
  path: "data/records"

log:
  level: info
  path: "logs"

# 安全：IP 白名单（网络层入口限制，覆盖页面与全部接口）
# 默认关闭；开启后仅允许列表内的 IP/网段访问，其余一律 403。
# 支持精确 IP（192.168.1.10）或 CIDR 网段（192.168.1.0/24）。
security:
  ip-whitelist-enabled: false
  ip-whitelist:
    - 127.0.0.1
    - 192.168.1.0/24
